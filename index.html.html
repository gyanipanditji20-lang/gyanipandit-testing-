<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Login Test Page</title>
    <!-- Tailwind CSS for modern styling and responsiveness -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex items-center justify-center p-4">

    <!-- Container Card -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-8 transition-all duration-300">
        
        <!-- Login Form View -->
        <div id="login-container">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Welcome Back</h2>
                <p class="text-sm text-gray-500 mt-2">Please sign in to your testing account</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username / Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        required
                        placeholder="Enter testuser"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-gray-800"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        required
                        placeholder="Enter password123"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-gray-800"
                    >
                </div>

                <button 
                    type="submit" 
                    id="login-button"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition duration-200 transform active:scale-95 cursor-pointer"
                >
                    Sign In
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-xs text-gray-400">Hint for testing: use any non-empty credentials</p>
            </div>
        </div>

        <!-- Dashboard View (Hidden by default, shown on successful login) -->
        <div id="dashboard" class="hidden text-center py-8">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                ✓
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Welcome to Dashboard</h1>
            <p class="text-gray-600 text-sm mb-6">You have successfully logged in via automation test.</p>
            <button 
                onclick="logout()" 
                class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl transition text-sm"
            >
                Log Out
            </button>
        </div>

    </div>

    <!-- Script to handle simulated login switch -->
    <script>
        function handleLogin(event) {
            event.preventDefault(); // Prevent actual form post refresh
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            if(usernameInput && passwordInput) {
                // Hide login form and show dashboard view
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            }
        }

        function logout() {
            // Reset form and view
            document.getElementById('login-form').reset();
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
